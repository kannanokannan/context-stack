name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sibling repositories can drift without touching this one, so check daily.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: context-stack

      # Every sibling at its published main, side by side. The composition
      # checks read them from disk; the schedule catches drift in any of them.
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/ContextOps
          path: ContextOps
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/ContextBoundary
          path: ContextBoundary
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/contextboundary-gw
          path: contextboundary-gw
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/Sthala
          path: Sthala
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/Griha
          path: Griha
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/context-stack-mcp
          path: context-stack-mcp
      - uses: actions/checkout@v4
        with:
          repository: kannanokannan/kannanokannan.github.io
          path: kannanokannan.github.io

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Verify stack registries and composition
        working-directory: context-stack
        run: python3 scripts/verify_stack.py
