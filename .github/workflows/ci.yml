name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sibling repositories can drift without touching this one, so check daily.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Verify stack registries
        run: python3 scripts/verify_stack.py
